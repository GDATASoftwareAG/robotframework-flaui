version: 1.0.{build}
branches:
  except:
  - '*documentation'

image: Visual Studio 2019

environment:
  matrix:
    - job_name: Python 3.15 x86
      PYTHON: "C:\\Python315"
      PYTHON_VERSION: 3.15
      PYTHON_ARCH: 32

    - job_name: Python 3.15 x64
      PYTHON: "C:\\Python315-x64"
      PYTHON_VERSION: 3.15
      PYTHON_ARCH: 64

init:
  - ECHO %PYTHON% %PYTHON_VERSION% %PYTHON_ARCH%

install:
- ps: |
    if ($env:PYTHON_VERSION -eq '3.15' -and -not (Test-Path "$env:PYTHON\python.exe")) {
      $platform = if ($env:PYTHON_ARCH -eq '64') { 'x64' } else { 'x86' }
      & "$env:APPVEYOR_BUILD_FOLDER\ci\install_python315.ps1" -PythonPath $env:PYTHON -Platform $platform
    }

- cmd: >-
    set PATH=%PYTHON%;%PYTHON%\\Scripts;%PATH%
    
    python --version
    
    python -m pip install -r requirements-buildsystem.txt

build: off

test_script: >-
    python -m builddrone build
  
    python -m builddrone robocop

    python -m builddrone pylint

    python -m builddrone test

# Normal artifacts (for successful builds)
artifacts:
- path: result/
  name: results
- path: dist/*.whl
  name: wheel
- path: dist/*.tar.gz
  name: source
- path: keywords/keywords.html
  name: keywords.html
- path: keywords/keywords.xml
  name: keywords.xml

deploy_script:
- ps: |
      if ($env:APPVEYOR_REPO_TAG -eq 'true') {
        & "$env:PYTHON\python.exe" -m builddrone pypi
      } else {
        Write-Output "No tag for deployment"
      }

on_finish:
- ps: |
    & "$env:PYTHON\python.exe" -m builddrone appveyor_upload_tests

on_failure:
- ps: |
    $ErrorActionPreference = 'Continue'
    & "$env:PYTHON\python.exe" -m builddrone appveyor_upload_failure_artifacts

