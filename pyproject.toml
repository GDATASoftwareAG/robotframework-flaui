[project]
name= "robotframework-flaui"
dynamic = ["version", "dependencies", "license"]
description = "Windows GUI testing library for Robot Framework"
readme = "README.md"
authors = [{ name = "G DATA CyberDefense AG", email = "opensource@gdata.de" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Testing",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library"
]

[project.urls]
Homepage = "https://github.com/GDATASoftwareAG/robotframework-flaui"
Documentation = "https://gdatasoftwareag.github.io/robotframework-flaui"
Repository = "https://github.com/GDATASoftwareAG/robotframework-flaui"
PyPI = "https://pypi.org/project/robotframework-flaui"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
FlaUILibrary = ["bin/*.dll"]

[tool.setuptools]
include-package-data = true
